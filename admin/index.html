<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLЁNKA // Админка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315202b'/%3E%3Crect x='7' y='10' width='18' height='13' rx='2' fill='none' stroke='%236fd0ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16.5' r='3.5' fill='none' stroke='%236fd0ee' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#e8ecf0;--panel:rgba(255,255,255,.72);--ink:#15202b;--ink-2:#44525f;--muted:#7f8d9a;
 --line:rgba(21,32,43,.12);--line-2:rgba(21,32,43,.24);--accent:#1a9cc6;--accent-2:#6fd0ee;
 --accent-soft:rgba(26,156,198,.1);--danger:#d2393c;--ok:#17a078;
 --font:"Exo 2",system-ui,"Segoe UI",sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
 --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;font:300 16px/1.5 var(--font);color:var(--ink);
 background:radial-gradient(ellipse at 50% 0%,#fff 0%,var(--bg) 60%) fixed,var(--bg);overflow-x:hidden}
button,input{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
.mono{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}

/* фон: сетка + бегущие сканлайны */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx--grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
 background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);opacity:.5}
.fx--scan{background:repeating-linear-gradient(0deg,rgba(21,32,43,.035) 0 1px,transparent 1px 3px)}
.fx--beam{height:140px;inset:auto 0 auto 0;top:-140px;background:linear-gradient(transparent,rgba(111,208,238,.12),transparent);animation:beam 7s linear infinite}
@keyframes beam{to{transform:translateY(calc(100vh + 140px))}}

/* загрузочный экран */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .5s var(--ease),visibility .5s}
#boot.done{opacity:0;visibility:hidden}
.boot__in{width:min(360px,80vw)}
.boot__bar{height:2px;background:var(--line);margin:12px 0 8px;overflow:hidden}
.boot__bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent-2);transition:width .1s}
.boot__row{display:flex;justify-content:space-between;color:var(--muted)}

/* сайдбар */
aside{position:sticky;top:0;height:100vh;width:280px;flex:none;z-index:2;display:flex;flex-direction:column;
 background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 18px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand__logo{width:38px;height:38px;border:1px solid var(--line-2);display:grid;place-items:center;position:relative}
.brand__logo:after{content:"";position:absolute;inset:4px;border:1px solid var(--accent);animation:spin 9s linear infinite;clip-path:polygon(0 0,40% 0,40% 100%,0 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{font-weight:800;letter-spacing:.18em;display:block;font-size:1.05rem}
.brand span{color:var(--accent)}
.side__h{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:8px}
#side{flex:1;overflow:auto;margin:0 -6px;padding:0 6px}
.g{position:relative;display:flex;gap:12px;align-items:baseline;padding:10px 12px;cursor:pointer;margin-top:4px;
 border:1px solid transparent;transition:background .25s,border-color .25s,transform .25s var(--ease);animation:inL .45s var(--ease) both}
.g .mono{color:var(--muted)}
.g:hover{background:var(--accent-soft);transform:translateX(3px)}
.g.on{border-color:var(--line-2);background:#fff}
.g.on:before,.g.on:after{content:"";position:absolute;width:8px;height:8px;border:2px solid var(--accent)}
.g.on:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.g.on:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.g.on .mono{color:var(--accent)}
.g__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes inL{from{opacity:0;transform:translateX(-12px)}}

/* кнопки */
.btn{color:var(--ink);position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line-2);background:rgba(255,255,255,.6);
 cursor:pointer;text-decoration:none;font-weight:400;overflow:hidden;transition:border-color .25s,color .25s,background .25s,transform .15s}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(111,208,238,.35) 50%,transparent 70%);transform:translateX(-100%)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:hover:before{transform:translateX(100%);transition:transform .6s var(--ease)}
.btn:active{transform:scale(.97)}
.btn--p{background:var(--ink);color:#fff!important;border-color:var(--ink)}
.btn--p:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--d:hover{border-color:var(--danger);color:var(--danger)}
.btn--ghost{border-color:transparent;background:none;padding:6px 8px}
.side__foot{display:grid;gap:8px;margin-top:16px}
.side__foot .btn{justify-content:center}

/* основная часть */
main{flex:1;min-width:0;position:relative;z-index:1;padding:26px clamp(16px,3vw,40px) 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.crumbs{color:var(--muted)}.crumbs b{color:var(--accent);font-weight:600}
.head{animation:up .5s var(--ease) both}
.head h1{font-weight:200;font-size:clamp(32px,4vw,52px);line-height:1.05;margin:4px 0 18px;letter-spacing:.01em}
.head h1 .glitch{position:relative;display:inline-block}
.glitch.on:before,.glitch.on:after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch.on:before{color:var(--accent);animation:gl1 .45s steps(2) 1;left:2px}
.glitch.on:after{color:var(--danger);animation:gl2 .45s steps(2) 1;left:-2px}
@keyframes gl1{0%{clip-path:inset(10% 0 60% 0)}50%{clip-path:inset(60% 0 10% 0)}100%{clip-path:inset(0 0 100% 0)}}
@keyframes gl2{0%{clip-path:inset(70% 0 5% 0)}50%{clip-path:inset(5% 0 70% 0)}100%{clip-path:inset(100% 0 0 0)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{position:relative;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:18px}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:grid;gap:6px}.fld .mono{color:var(--muted)}
.fld input[type=text],.fld input[type=date]{padding:10px 12px;border:1px solid var(--line-2);background:#fff;min-width:240px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;user-select:none}
.sw input{display:none}
.sw i{width:40px;height:22px;border:1px solid var(--line-2);position:relative;background:#fff;transition:background .25s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--muted);transition:transform .25s var(--ease),background .25s}
.sw input:checked+i{background:var(--accent-soft);border-color:var(--accent)}
.sw input:checked+i:after{transform:translateX(18px);background:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.corner:before,.corner:after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--accent)}
.corner:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.corner:after{right:-1px;bottom:-1px;border-left:0;border-top:0}

section.f{margin-top:26px;animation:up .5s var(--ease) both}
.f__h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.f__h h3{margin:0;font-weight:400;font-size:1.35rem}
.f__h .mono{color:var(--muted)}
.f__h a{cursor:pointer;color:var(--ink-2);text-decoration:none;border-bottom:1px dashed var(--line-2)}
.f__h a:hover{color:var(--accent);border-color:var(--accent)}
.f__h a.del:hover{color:var(--danger);border-color:var(--danger)}

.zone{position:relative;border:1px dashed var(--line-2);padding:22px;text-align:center;background:rgba(255,255,255,.45);transition:background .25s,border-color .25s;overflow:hidden}
.zone:before{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(transparent,rgba(111,208,238,.18),transparent);opacity:0}
.zone.over{border-color:var(--accent);background:var(--accent-soft)}
.zone.over:before,.zone.busy:before{opacity:1;animation:sweep 1.2s linear infinite}
@keyframes sweep{to{top:100%}}
.zone label{color:var(--accent);cursor:pointer;border-bottom:1px solid currentColor}
.zone input{display:none}
.zone .mono{color:var(--muted);display:block;margin-top:6px}
.prog{height:2px;background:var(--line);margin-top:12px;overflow:hidden;display:none}
.zone.busy .prog{display:block}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-2);transition:width .3s var(--ease)}
.st{margin-top:8px;color:var(--ink-2);min-height:1.2em}

.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.ph>div{position:relative;overflow:hidden;background:#dfe5ea;animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:transform .5s var(--ease),filter .4s}
.ph>div:hover img{transform:scale(1.07);filter:saturate(1.15)}
.ph>div:after{content:"";position:absolute;inset:0;border:2px solid transparent;transition:border-color .25s;pointer-events:none}
.ph>div:hover:after{border-color:var(--accent-2)}
.ph>div.cov:after{border-color:var(--accent)}
.ph b,.ph i{position:absolute;top:6px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;font-style:normal;font-weight:400;
 background:rgba(255,255,255,.9);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease),background .2s,color .2s}
.ph>div:hover b,.ph>div:hover i,.ph>div.cov i{opacity:1;transform:none}
.ph b{right:6px}.ph b:hover{background:var(--danger);color:#fff}
.ph i{left:6px}.ph i:hover{background:var(--accent);color:#fff}
.ph>div.cov i{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-2)}
.ph>div.out{animation:out .35s var(--ease) forwards}
@keyframes out{to{opacity:0;transform:scale(.8);filter:blur(4px)}}
.badge{position:absolute;left:6px;bottom:6px;background:var(--accent);color:#fff;padding:2px 6px}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.empty h2{font-weight:200;font-size:36px;color:var(--ink);margin:10px 0}

/* обложка и точка фокуса */
.covbox{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.covbox .mono{color:var(--muted);display:block;margin-bottom:6px}
.cfull{position:relative;display:inline-block;cursor:crosshair;line-height:0}
.cfull img{max-height:240px;max-width:320px;display:block}
.cfull .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--accent-2);border-radius:50%;box-shadow:0 0 0 2px rgba(21,32,43,.5),0 0 14px var(--accent-2);pointer-events:none;transition:left .3s var(--ease),top .3s var(--ease)}
.cfull .dot:after{content:"";position:absolute;inset:9px;background:var(--accent-2);border-radius:50%}
.ccrop{width:150px;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line-2);line-height:0}
.ccrop img{width:100%;height:100%;object-fit:cover;transition:object-position .35s var(--ease)}
.chint{max-width:240px;color:var(--ink-2);font-size:.9rem}
/* раздел «Сайт» */
.g--site{border:1px dashed var(--line-2);margin:0 0 14px}
.g--site .mono{color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.sl{position:relative;background:#dfe5ea;cursor:grab;animation:pop .45s var(--ease) both;transition:transform .25s var(--ease),box-shadow .25s,opacity .2s}
.sl img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;pointer-events:none}
.sl.drag{opacity:.35}.sl.over{transform:scale(.96);box-shadow:0 0 0 2px var(--accent)}
.sl .n{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;padding:3px 7px}
.sl .ctl{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:space-between;opacity:0;transition:opacity .2s}
.sl:hover .ctl{opacity:1}
.sl .ctl button{width:30px;height:30px;padding:0;border:0;background:rgba(255,255,255,.92);cursor:pointer}
.sl .ctl button:hover{background:var(--accent);color:#fff}.sl .ctl [data-sdel]:hover{background:var(--danger)}
.about{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:12px}
.about .cfull img{max-height:320px}
.about .mono{display:block;margin-bottom:6px;color:var(--muted)}
.about .ccrop{width:200px;aspect-ratio:4/5}
/* модалка и тосты */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(21,32,43,.35);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#modal.on{opacity:1;visibility:visible}
.m{width:min(440px,90vw);background:#fff;padding:22px;border:1px solid var(--line-2);position:relative;transform:translateY(16px) scale(.98);transition:transform .35s var(--ease)}
#modal.on .m{transform:none}
.m .mono{color:var(--accent)}
.m p{margin:8px 0 14px;white-space:pre-line}
.m input{width:100%;padding:10px 12px;border:1px solid var(--line-2);outline:none}
.m input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.m__a{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toasts{position:fixed;right:20px;bottom:20px;z-index:45;display:grid;gap:8px}
.t{background:var(--ink);color:#fff;padding:12px 16px;border-left:3px solid var(--accent-2);animation:tin .35s var(--ease) both;max-width:360px}
.t.err{border-color:var(--danger)}
.t.bye{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

@media(max-width:800px){body{display:block}aside{position:relative;height:auto;width:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="fx fx--grid"></div><div class="fx fx--scan"></div><div class="fx fx--beam"></div>

<div id="boot"><div class="boot__in">
 <div class="mono" style="color:var(--accent)">// plёnka · admin</div>
 <div class="boot__bar"><i id="bootBar"></i></div>
 <div class="boot__row mono"><span>Синхронизация</span><span id="bootPct">0%</span></div>
</div></div>

<aside>
 <div class="brand"><div class="brand__logo">◎</div><div><b>PLЁNKA</b><span class="mono">admin console</span></div></div>
 <div class="g g--site" data-s="__site"><span class="mono">◈</span><span class="g__t">Сайт: обо мне и слайдер</span></div>
 <div class="side__h mono"><span>Галереи</span><span id="cnt">00</span></div>
 <div id="side"></div>
 <div class="side__foot">
  <button class="btn" id="ng">+ Новая галерея</button>
  <a class="btn" id="site" target="_blank" rel="noopener">Открыть сайт ↗</a>
  <button class="btn btn--p" id="top">⇪ Опубликовать на сайт</button>
 </div>
</aside>
<main id="main"></main>
<div id="modal"><div class="m corner" id="mbox"></div></div>
<div id="toasts"></div>

<script>
const SITE='https://garethdemon.github.io/Plenka-studio/';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
let d={galleries:[]},cur=null,lastCur=null,S={about:null,slider:[]};
$('#site').href=SITE;

/* загрузка */
(()=>{let p=0;const t=setInterval(()=>{p=Math.min(100,p+7+Math.random()*16);$('#bootBar').style.width=p+'%';$('#bootPct').textContent=Math.round(p)+'%';
 if(p>=100){clearInterval(t);setTimeout(()=>$('#boot').classList.add('done'),180)}},55)})();

/* тосты и модалки вместо alert/prompt/confirm */
function toast(msg,err){const e=document.createElement('div');e.className='t'+(err?' err':'');e.textContent=msg;$('#toasts').append(e);
 setTimeout(()=>{e.classList.add('bye');setTimeout(()=>e.remove(),300)},err?5000:2600)}
function modal({title,text='',input,ok='OK',cancel='Отмена',danger}){return new Promise(res=>{
 $('#mbox').innerHTML=`<div class="mono">// ${esc(title)}</div><p>${esc(text)}</p>${input!==undefined?`<input id="mi" value="${esc(input)}">`:''}
  <div class="m__a">${cancel?`<button class="btn" data-m="0">${cancel}</button>`:''}<button class="btn ${danger?'btn--d':'btn--p'}" data-m="1">${ok}</button></div>`;
 $('#modal').classList.add('on');const mi=$('#mi');if(mi){mi.focus();mi.select()}
 const done=v=>{$('#modal').classList.remove('on');document.removeEventListener('keydown',key);res(v)};
 const key=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter')done(mi?mi.value.trim():true)};
 document.addEventListener('keydown',key);
 $('#mbox').onclick=e=>{const m=e.target.dataset.m;if(m==='1')done(mi?mi.value.trim():true);if(m==='0')done(null)};
 $('#modal').onclick=e=>{if(e.target.id==='modal')done(null)}})}

async function api(n,b){const r=await fetch('/api/'+n,{method:'POST',body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function act(n,b,msg){try{d=await api(n,b);render();if(msg)toast(msg)}catch(e){toast(e.message,true)}}
async function reload(){d=await(await fetch('/api/data')).json();try{S=await api('site',{action:'get'})}catch(e){toast('Админка устарела: закрой чёрное окно и запусти ярлык заново',true)}render()}
async function sact(b,msg){try{S=await api('site',b);render();if(msg)toast(msg)}catch(e){toast(e.message,true)}}
const link=slug=>`${SITE}gallery.html?g=${slug}`;

function renderSite(){
 const a=S.about,fx=(a&&a.focus)||'50% 35%',[fxX,fxY]=fx.split(' ');
 $('#main').innerHTML=`<div class="top"><div class="crumbs mono">Раздел <b>сайт</b> · обо мне · слайдер ${pad(S.slider.length)} кадров</div>
  <div class="acts" style="margin:0"><a class="btn" href="${SITE}#about" target="_blank" rel="noopener">Посмотреть на сайте ↗</a></div></div>
 <div class="head"><h1><span class="glitch on" data-t="Витрина сайта">Витрина сайта</span></h1></div>
 <section class="f" data-kind="about"><div class="f__h"><h3>Фото «Обо мне»</h3><span class="mono">одно фото · 4:5</span>${a?'<a class="del" data-adel>удалить</a>':''}</div>
  <div class="zone"><div>${a?'Перетащите фото сюда, чтобы заменить, или':'Перетащите фото сюда или'} <label>выберите файл<input type="file" accept="image/*"></label></div><span class="mono">сжимается для сайта автоматически</span><div class="prog"><i></i></div><div class="st"></div></div>
  ${a?`<div class="about"><div><span class="mono">Кликни по лицу</span><div class="cfull" id="afull"><img src="/photos/site/web/${a.file}" alt=""><span class="dot" style="left:${fxX};top:${fxY}"></span></div></div>
  <div><span class="mono">Так увидят на сайте</span><div class="ccrop" id="acrop"><img src="/photos/site/web/${a.file}" alt="" style="object-position:${fx}"></div></div></div>`:''}</section>
 <section class="f" data-kind="slider"><div class="f__h"><h3>Слайдер лучших кадров</h3><span class="mono">${pad(S.slider.length)} кадров · лучше 5–7</span></div>
  <div class="zone"><div>Перетащите кадры сюда или <label>выберите файлы<input type="file" multiple accept="image/*"></label></div><span class="mono">порядок — перетаскиванием карточек или стрелками</span><div class="prog"><i></i></div><div class="st"></div></div>
  <div class="sgrid" id="sgrid">${S.slider.map((x,i)=>`<div class="sl" draggable="true" data-file="${x.file}" style="animation-delay:${i*40}ms"><img src="/photos/site/thumb/${x.file}" alt=""><span class="n mono">${pad(i+1)}</span>
   <div class="ctl"><button data-mv="-1" title="Левее">←</button><button data-sdel title="Удалить">✕</button><button data-mv="1" title="Правее">→</button></div></div>`).join('')}</div></section>`;
}
async function upSite(kind,files,zone){
 files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;if(kind=='about')files=files.slice(0,1);
 const st=zone.querySelector('.st'),bar=zone.querySelector('.prog i');zone.classList.add('busy');let i=0,ok=0;
 for(const f of files){st.textContent=`Загрузка ${++i}/${files.length}: ${f.name}`;
  const r=await fetch(`/api/site_upload?kind=${kind}&name=${encodeURIComponent(f.name)}`,{method:'POST',body:f});
  if(!r.ok)toast((await r.json()).error,true);else{S=await r.json();ok++}bar.style.width=(i/files.length*100)+'%'}
 zone.classList.remove('busy');if(ok)toast(kind=='about'?'Фото «Обо мне» обновлено':`В слайдер добавлено: ${ok}`);render();
}
const order=()=>[...document.querySelectorAll('#sgrid .sl')].map(x=>x.dataset.file);
function render(){
 document.querySelectorAll('.g--site').forEach(x=>x.classList.toggle('on',cur=='__site'));
 if(cur=='__site'){$('#cnt').textContent=pad(d.galleries.length);$('#side').querySelectorAll('.g').forEach(x=>x.classList.remove('on'));if(!$('#side').children.length)renderSide();renderSite();lastCur=cur;return}
 if(!d.galleries.find(g=>g.slug==cur))cur=d.galleries[0]&&d.galleries[0].slug;
 const fresh=cur!==lastCur;lastCur=cur;
 $('#cnt').textContent=pad(d.galleries.length);
 renderSide();
 const g=d.galleries.find(x=>x.slug==cur);
 if(!g){$('#main').innerHTML=`<div class="empty"><div class="mono" style="color:var(--accent)">// память пуста</div><h2>Создайте первую галерею</h2><button class="btn btn--p" id="ng2">+ Новая галерея</button></div>`;return}
 const total=g.folders.reduce((s,f)=>s+f.photos.length,0);
 $('#main').innerHTML=`<div class="top"><div class="crumbs mono">Последовательность <b>${pad(d.galleries.indexOf(g)+1)}</b> · ${total} фото · ${g.folders.length} папк${g.folders.length==1?'а':'и'}</div>
  <div class="acts" style="margin:0"><a class="btn" href="${link(g.slug)}" target="_blank" rel="noopener">Галерея на сайте ↗</a><a class="btn" href="${SITE}" target="_blank" rel="noopener">Главная ↗</a></div></div>
 <div class="head"><h1><span class="glitch${fresh?' on':''}" data-t="${esc(g.title)}">${esc(g.title)}</span></h1>
 <div class="card corner"><div class="form">
  <label class="fld"><span class="mono">Название</span><input type="text" id="t" value="${esc(g.title)}"></label>
  <label class="fld"><span class="mono">Дата</span><input type="date" id="dt" value="${g.date}"></label>
  <label class="sw"><input type="checkbox" id="h" ${g.hidden?'checked':''}><i></i><span>Скрытая <span class="mono" style="color:var(--muted)">только по ссылке · можно скачивать</span></span></label>
 </div><div class="acts"><button class="btn btn--p" id="sv">Сохранить</button><button class="btn" id="cp">Копировать ссылку</button><button class="btn" id="nf">+ Папка</button><button class="btn btn--d" id="dg">Удалить галерею</button></div>
 ${g.cover?`<div class="covbox"><div><span class="mono">Обложка · кликни по лицу</span><div class="cfull" id="cfull"><img src="/${g.cover}" alt=""><span class="dot" style="left:${(g.focus||'50% 50%').split(' ')[0]};top:${(g.focus||'50% 50%').split(' ')[1]}"></span></div></div>
 <div><span class="mono">Так увидят на сайте</span><div class="ccrop"><img src="/${g.cover}" alt="" style="object-position:${g.focus||'50% 50%'}"></div></div>
 <p class="chint">Обложку выбираешь звёздочкой ☆ на любом фото ниже. Потом кликни по лицу на картинке слева — превью на главной и фон галереи будут центрироваться по этой точке.</p></div>`:''}</div></div>`+
 g.folders.map((f,fi)=>`<section class="f" data-f="${f.id}" style="animation-delay:${80+fi*60}ms"><div class="f__h"><h3>${esc(f.name)}</h3><span class="mono">${pad(f.photos.length)} фото</span><a data-r>переименовать</a><a class="del" data-x>удалить папку</a></div>
  <div class="zone"><div>Перетащите фото сюда или <label>выберите файлы<input type="file" multiple accept="image/*"></label></div><span class="mono">jpg · png · webp — оригиналы сохраняются как есть</span>
  <div class="prog"><i></i></div><div class="st"></div></div>
  <div class="ph">${f.photos.map((p,i)=>{const t=`photos/${g.slug}/${f.id}/thumb/${p}`,c=g.cover==t;return `<div data-p="${p}" class="${c?'cov':''}" style="animation-delay:${Math.min(i,24)*25}ms"><img src="/${t}" loading="lazy" alt=""><b data-del title="Удалить">✕</b><i data-cov title="Сделать обложкой">${c?'★':'☆'}</i>${c?'<span class="badge mono">обложка</span>':''}</div>`}).join('')}</div></section>`).join('');
}

function renderSide(){$('#side').innerHTML=d.galleries.map((g,i)=>`<div class="g${g.slug==cur?' on':''}" data-s="${g.slug}" style="animation-delay:${i*40}ms">
  <span class="mono">${pad(i+1)}</span><span class="g__t">${esc(g.title)}</span>${g.hidden?'<span title="Скрытая">🔒</span>':''}</div>`).join('')}
async function up(slug,fid,files,zone){
 files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
 const st=zone.querySelector('.st'),bar=zone.querySelector('.prog i');zone.classList.add('busy');let i=0,okN=0;
 for(const f of files){st.textContent=`Загрузка ${++i}/${files.length}: ${f.name}`;
  const r=await fetch(`/api/upload?slug=${slug}&fid=${fid}&name=${encodeURIComponent(f.name)}`,{method:'POST',body:f});
  if(!r.ok){toast((await r.json()).error,true)}else okN++;
  bar.style.width=(i/files.length*100)+'%'}
 zone.classList.remove('busy');toast(`Загружено: ${okN} фото`);reload();
}

document.addEventListener('click',async e=>{
 const t=e.target,sec=t.closest('section'),fid=sec&&sec.dataset.f;
 if(t.closest('#afull')){const img=$('#afull img'),r=img.getBoundingClientRect();
  const x=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100))),y=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100))),f=`${x}% ${y}%`;
  $('#afull .dot').style.left=x+'%';$('#afull .dot').style.top=y+'%';$('#acrop img').style.objectPosition=f;
  try{S=await api('site',{action:'about_focus',focus:f});toast('Центр фото сохранён')}catch(x){toast(x.message,true)}}
 else if(t.dataset.adel!==undefined){if(await modal({title:'Удаление',text:'Убрать фото «Обо мне»?',ok:'Удалить',danger:1}))sact({action:'about_delete'},'Фото удалено')}
 else if(t.dataset.sdel!==undefined){if(await modal({title:'Удаление',text:'Убрать кадр из слайдера?',ok:'Удалить',danger:1}))sact({action:'slider_delete',file:t.closest('.sl').dataset.file},'Кадр убран')}
 else if(t.dataset.mv!==undefined){const o=order(),f=t.closest('.sl').dataset.file,i=o.indexOf(f),j=i+Number(t.dataset.mv);if(j<0||j>=o.length)return;o.splice(i,1);o.splice(j,0,f);sact({action:'slider_order',order:o})}
 else if(t.closest('#cfull')){const img=$('#cfull img'),r=img.getBoundingClientRect();
  const x=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100))),y=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)));
  const f=`${x}% ${y}%`;$('#cfull .dot').style.left=x+'%';$('#cfull .dot').style.top=y+'%';$('.ccrop img').style.objectPosition=f;
  try{d=await api('update',{slug:cur,focus:f});toast('Центр обложки сохранён')}catch(x){toast(x.message,true)}}
 else if(t.closest('.g')){cur=t.closest('.g').dataset.s;lastCur=null;render()}
 else if(t.id=='ng'||t.id=='ng2'){const title=await modal({title:'Новая галерея',text:'Название съёмки',input:'',ok:'Создать'});
  if(title){await act('gallery',{title,date:new Date().toISOString().slice(0,10)},'Галерея создана');cur=d.galleries[0].slug;render()}}
 else if(t.id=='sv')act('update',{slug:cur,title:$('#t').value,date:$('#dt').value,hidden:$('#h').checked},'Сохранено');
 else if(t.id=='dg'){if(await modal({title:'Удаление',text:'Удалить галерею вместе со всеми фото?',ok:'Удалить',danger:1}))act('delete_gallery',{slug:cur},'Галерея удалена')}
 else if(t.id=='cp'){try{await navigator.clipboard.writeText(link(cur));toast('Ссылка скопирована')}catch(x){modal({title:'Ссылка',input:link(cur),cancel:''})}}
 else if(t.id=='nf'){const name=await modal({title:'Новая папка',text:'Например: «Для соцсетей»',input:'',ok:'Создать'});if(name)act('folder',{slug:cur,name},'Папка создана')}
 else if(t.dataset.r!==undefined){const old=sec.querySelector('h3').textContent;const name=await modal({title:'Переименовать',input:old,ok:'Сохранить'});if(name&&name!==old)act('rename_folder',{slug:cur,fid,name})}
 else if(t.dataset.x!==undefined){if(await modal({title:'Удаление',text:'Удалить папку со всеми фото?',ok:'Удалить',danger:1}))act('delete_folder',{slug:cur,fid},'Папка удалена')}
 else if(t.dataset.del!==undefined){if(await modal({title:'Удаление',text:'Удалить это фото?',ok:'Удалить',danger:1})){const card=t.parentNode;card.classList.add('out');
  setTimeout(()=>act('delete_photo',{slug:cur,fid,file:card.dataset.p}),300)}}
 else if(t.dataset.cov!==undefined)act('update',{slug:cur,cover:`photos/${cur}/${fid}/thumb/${t.parentNode.dataset.p}`,focus:'50% 30%'},'Обложка обновлена — кликни по лицу, чтобы отцентровать');
 else if(t.closest('#top')){const b=$('#top');b.textContent='Публикуем…';
  try{const r=await api('publish');await modal({title:'Публикация',text:r.log||'Готово',cancel:'',ok:'Понятно'})}catch(x){toast(x.message,true)}
  b.textContent='⇪ Опубликовать на сайт'}
});
document.addEventListener('change',e=>{if(e.target.type=='file'){const s=e.target.closest('section');if(s.dataset.kind)upSite(s.dataset.kind,e.target.files,s.querySelector('.zone'));else up(cur,s.dataset.f,e.target.files,s.querySelector('.zone'));e.target.value=''}});
/* перетаскивание карточек слайдера */
let dragF=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.sl');if(c){dragF=c.dataset.file;c.classList.add('drag');e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragend',()=>{dragF=null;document.querySelectorAll('.sl').forEach(x=>x.classList.remove('drag','over'))});
['dragover','dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{
 e.preventDefault();
 if(dragF){const c=e.target.closest&&e.target.closest('.sl');document.querySelectorAll('.sl.over').forEach(x=>x.classList.remove('over'));if(!c||c.dataset.file==dragF)return;
  if(n=='dragover')c.classList.add('over');if(n=='drop'){const o=order();o.splice(o.indexOf(dragF),1);o.splice(o.indexOf(c.dataset.file)+(o.indexOf(c.dataset.file)>=0?0:0),0,dragF);const f=dragF;dragF=null;sact({action:'slider_order',order:o},'Порядок сохранён')}return}
 const z=e.target.closest&&e.target.closest('.zone');
 document.querySelectorAll('.zone.over').forEach(x=>x.classList.remove('over'));
 if(!z)return;if(n=='dragover')z.classList.add('over');
 if(n=='drop'){const s=z.closest('section');if(s.dataset.kind)upSite(s.dataset.kind,e.dataTransfer.files,z);else up(cur,s.dataset.f,e.dataTransfer.files,z)}}));
reload();
</script></body></html>
